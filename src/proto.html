<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>window.addEventListener("error",function(e){try{parent.postMessage({type:"tm:error",msg:String(e.message||"")+(e.lineno?" (line "+e.lineno+")":"")},"*")}catch(_){}});</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>비트코인 방향 맞추기 (오늘의 투표)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style id="tw">/*__TW__*/</style>
<script src="vendor/lucide.min.js"></script>
<style>
  html { color-scheme: light; }
  body { margin: 0; word-break: keep-all; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: rgba(20,23,28,.06); }
  [hidden] { display: none !important; }
  svg.lucide { flex-shrink: 0; }
  .app-bg { background: linear-gradient(180deg, #E8EFFF 0%, #F5F7FB 320px, #F5F7FB 100%); min-height: 100vh; }
  .card { background: #fff; border-radius: 24px; box-shadow: 0 12px 28px -16px rgba(31,67,192,.25), 0 1px 2px rgba(20,23,28,.04); }
  .card-lift { background: #fff; border-radius: 24px; box-shadow: 0 12px 28px 0 rgba(31,67,192,.18), 0 1px 2px rgba(20,23,28,.04); }
  .btn { height: 46px; border-radius: 16px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; transition: background-color .15s, transform .1s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: #2F5BEA; color: #fff; }
  .btn-primary:hover { background: #2448C9; }
  .btn-soft { background: #EAF0FF; color: #2F5BEA; }
  .btn-soft:hover { background: #DCE6FF; }
  .btn-line { background: #fff; color: #6B7280; box-shadow: inset 0 0 0 1px #EEF0F3; }
  .btn-line:hover { background: #FAFAFB; }
  .btn:disabled { background: #E5E7EB; color: #9CA3AF; cursor: not-allowed; transform: none; box-shadow: none; }
  .slot { width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; }
  .slot-on { background: linear-gradient(180deg, #5C8BFF, #2F5BEA); color: #fff; }
  .slot-now { background: #F5F7FB; box-shadow: inset 0 0 0 2px #2F5BEA; }
  .slot-off { background: #F5F7FB; box-shadow: inset 0 0 0 1px #D7DBE2; }
  .dim { background: rgba(12,16,24,.45); }
  .sheet-in { animation: sheetIn .22s ease-out; }
  .pop-in { animation: popIn .18s ease-out; }
  @keyframes sheetIn { from { transform: translateY(24px); opacity: .6 } to { transform: none; opacity: 1 } }
  @keyframes popIn { from { transform: scale(.97); opacity: .6 } to { transform: none; opacity: 1 } }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 80; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: rgba(20,23,28,.92); color: #fff; font-size: 13px; line-height: 1.45; text-align: center; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
  .chk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px #D1D5DB; color: transparent; flex: none; }
  .chk.on { background: #2F5BEA; box-shadow: none; color: #fff; }
  .acc-row { border-radius: 7px; }
  .acc-row.sel { background: #EAF0FF; }
  .acc-row:not(.sel) { background: #F7F7F6; }
  .acc-row.off { opacity: .45; }
  .ring { --p: 0; width: 66px; height: 66px; border-radius: 50%; background: conic-gradient(#2F5BEA calc(var(--p) * 1%), #E8EDF7 0); display: grid; place-items: center; }
  .ring > span { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .qr { display: grid; grid-template-columns: repeat(21, 1fr); width: 118px; height: 118px; }
  .qr i { display: block; }
  .qr i.b { background: #14171C; }
</style>
</head>
<body class="font-sans text-ink bg-bg">
<div id="app"></div>
<div id="layer"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gUp" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0B7A55"/><stop offset=".55" stop-color="#16B47E"/><stop offset="1" stop-color="#5BE3AE"/></linearGradient>
    <linearGradient id="gDown" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A8C"/><stop offset=".5" stop-color="#E0384F"/><stop offset="1" stop-color="#A51D33"/></linearGradient>
    <symbol id="arUp" viewBox="0 0 64 64"><ellipse cx="30" cy="58" rx="16" ry="3.5" fill="rgba(20,23,28,.12)"/><polygon points="54,8 54,40 45,31 22,54 10,42 33,19 22,8" fill="url(#gUp)"/><polygon points="54,8 54,14 28,14 22,8" fill="rgba(255,255,255,.35)"/></symbol>
    <symbol id="arDown" viewBox="0 0 64 64"><ellipse cx="34" cy="60" rx="16" ry="3.5" fill="rgba(20,23,28,.12)"/><polygon points="54,54 54,22 45,31 22,8 10,20 33,43 22,54" fill="url(#gDown)"/><polygon points="22,8 10,20 14,22 24,12" fill="rgba(255,255,255,.35)"/></symbol>
  </defs>
</svg>

<script>
(() => {
  // ===================================================================
  // 비트코인 방향 맞추기 (오늘의 투표) · 개발 확인용 화면 본체
  // 주소 해시(#p=P01&vote=up&…)로 화면 · 상태를 정한다. 셸(index.html)이 케이스별로 넘긴다
  // 시간은 시뮬레이션 시계(now)로 돌고, 표시는 기기 시간대 · 언어를 따른다
  // ===================================================================
  const Q = new URLSearchParams(location.search);
  const EN = Q.get('lang') === 'en';
  const L = (ko, en) => (EN ? en : ko);
  if (EN) document.documentElement.lang = 'en';
  const H = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const flags = new Set((H.e || '').split(',').filter(Boolean));
  const has = (f) => flags.has(f);
  const HOUR = 36e5, DAY = 864e5;

  // ---------- 상태 ----------
  const S = {
    p: H.p || 'P01',
    now0: Date.parse(H.now || '2026-10-29T05:00:00Z'), t0: Date.now(),
    vote: H.vote || '',                    // 이번 회차 내 선택: up | down | ''
    entry: 121430.84,                       // 확정한 기준가
    lockedAt: Date.parse(H.now || '2026-10-29T05:00:00Z'),
    price: 121455.08,
    bal: H.bal !== undefined ? +H.bal : 0.5,
    streak: H.streak !== undefined ? +H.streak : 2,   // 이번 회차 전까지 연속 출석 횟수
    broken: H.broken === '1',              // 직전 회차를 놓쳐 연속이 끊긴 상태
    att: H.att || '',                       // 내 적립금 출석 카드 강제 상태 (todo | done | closed | broken)
    noti: H.noti || 's1',                   // s1 미동의 · s2 기기 알림 꺼짐 · s3 모두 켜짐(미노출) · done 신청 완료 직후
    kr: Q.get('kr') || H.kr || 'kr',
    nd: Q.get('nd') || H.nd || 'off',
    os: Q.get('os') || H.os || 'yes',
    res: H.res || '',                       // 진입 시 미확인 결과: hit | miss | multi
    hist: H.hist || 'data',
    acc: H.acc || 'yes',                    // yes | none(첫 연동 보너스 대상) | nobonus
    notes: H.notes === '1',
    few: H.few === '1',                     // 참여 인원 1,000명 미만
    r0: H.r0 === '1',                       // 지난 회차 참여자 0명
    stack: [],
  };
  const nowMs = () => S.now0 + (Date.now() - S.t0);

  // ---------- 시간 ----------
  const TZ = H.tz || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const LOC = EN ? 'en-US' : 'ko-KR';
  function roundOf(t) {
    const d = new Date(t); const day0 = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    const h = (t - day0) / HOUR;
    if (h < 9) return { phase: 'open', closeAt: day0 + 9 * HOUR, resultAt: day0 + 10 * HOUR };
    if (h < 10) return { phase: 'closed', closeAt: day0 + 9 * HOUR, resultAt: day0 + 10 * HOUR };
    return { phase: 'open', closeAt: day0 + DAY + 9 * HOUR, resultAt: day0 + DAY + 10 * HOUR };
  }
  const phase = () => (has('e04') ? 'tally' : roundOf(nowMs()).phase);
  const pad = (n) => String(n).padStart(2, '0');
  const hms = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(pad); };
  const parts = (ms) => Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(ms).map((p) => [p.type, p.value]));
  const clock = (ms) => new Intl.DateTimeFormat(LOC, { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(ms);
  const ymdhm = (ms) => { const p = parts(ms); return `${p.year}.${p.month}.${p.day} ${p.hour}:${p.minute}`; };
  const mmdd = (ms) => { const p = parts(ms); return `${p.month}.${p.day}`; };
  const dayKey = (ms) => { const p = parts(ms); return p.year + p.month + p.day; };
  function nextVoteHtml() {
    const r = roundOf(nowMs()); const at = r.resultAt;   // 다음 회차 오픈 = 이번 회차 결과 발표 시각(10:00 UTC)
    const today = dayKey(at) === dayKey(nowMs());
    return EN ? `Next call opens <b class="text-ink">${today ? 'today' : 'tomorrow'} at ${clock(at)}</b>`
      : `다음 투표는 <b class="text-ink">${today ? '오늘' : '내일'} ${clock(at)}</b>부터 할 수 있어요`;
  }
  // 연속이 끊긴 회차: 첫 번째로 놓친 회차의 마감 시각(09:00 UTC)을 기기 시간대로
  const missedClose = Date.UTC(2026, 9, 27, 9);
  const brokenMsg = () => EN ? `Missed the ${mmdd(missedClose)} ${clock(missedClose)} round, so your streak restarts` : `${mmdd(missedClose)} ${clock(missedClose)} 마감 회차에 참여하지 않아 다시 시작해요`;

  // ---------- 숫자 ----------
  const f2 = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const usdt = (n, big = '') => `<span class="${big}">${f2(n)}</span><span class="text-[11px] text-mute font-medium"> USDT</span>`;
  // 비율: 상승 반올림, 하락 = 100 − 상승. 한쪽이 1표 이상인데 0%가 되면 1% / 99%
  function ratio(up, down) {
    const t = up + down; if (!t) return null;
    let u = Math.round((up / t) * 100);
    if (up > 0 && u === 0) u = 1;
    if (down > 0 && u === 100) u = 99;
    return [u, 100 - u];
  }
  const VOTES = { up: 781, down: 459 };    // 이번 회차 · 지난 회차 예시 표 수

  // ---------- 공통 조각 ----------
  const icon = (n, c = 'w-4 h-4') => `<i data-lucide="${n}" class="${c}"></i>`;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const arrow = (dir, size = 64) => `<svg width="${size}" height="${size}" aria-hidden="true"><use href="#${dir === 'up' ? 'arUp' : 'arDown'}"/></svg>`;
  const coin = (size = 72) => `<span class="relative inline-block shrink-0" style="width:${size}px;height:${size}px"><img src="assets/symbol/Bitcoin.svg.webp" alt="" class="w-full h-full rounded-full object-cover shadow-[0_8px_18px_-8px_rgba(180,98,14,.55)]"><span class="absolute -left-1 top-1 w-2 h-2 rounded-full bg-up-bar"></span><span class="absolute right-0 -top-1 w-1.5 h-1.5 rounded-full bg-brand"></span></span>`;
  const circleArt = (name, bg, fg, size = 82) => `<span class="grid place-items-center rounded-full shrink-0" style="width:${size}px;height:${size}px;background:${bg};color:${fg}">${icon(name, 'w-1/2 h-1/2')}</span>`;
  const isPhone = () => window.innerWidth < 768;

  function header() {
    return `<header class="sticky top-0 z-30">
      <div class="h-11 bg-white flex items-center justify-between px-5 text-[14px] font-medium" aria-hidden="true"><span>9:41</span><span class="flex items-center gap-1 text-ink">${icon('wifi', 'w-4 h-4')}${icon('signal', 'w-4 h-4')}${icon('battery-full', 'w-5 h-5')}</span></div>
      <div class="h-14 bg-bg flex items-center px-4"><button type="button" data-act="back" data-k="back" aria-label="${L('뒤로', 'Back')}" class="w-9 h-9 -ml-1.5 grid place-items-center rounded-full hover:bg-black/5">${icon('arrow-left', 'w-6 h-6')}</button></div>
    </header>`;
  }
  function btcCard() {
    const loading = has('e01');
    return `<div class="card-lift mx-[17px] px-4 py-3.5 flex items-center justify-between" data-k="price">
      <div class="flex items-center gap-2"><img src="assets/symbol/Bitcoin.svg.webp" alt="" class="w-[34px] h-[34px] rounded-full"><div><p class="text-[13px] font-bold leading-[17px]">BTCUSDT</p><p class="text-[11px] text-mute">${L('현재가', 'Current price')}</p></div></div>
      ${loading ? `<p class="text-[13px] text-mute font-medium flex items-center gap-1.5" data-k="loading">${icon('loader-circle', 'w-4 h-4 animate-spin')}${L('시세를 불러오는 중이에요', 'Loading the price')}</p>` : `<p class="text-right font-bold">${usdt(S.price, 'text-[19px] tracking-[-0.3px]')}</p>`}
    </div>`;
  }
  function chip(label, ms, tone) {
    const [h, m, s] = hms(ms);
    const c = tone === 'amber' ? 'bg-amber-soft text-amber' : 'bg-up-soft text-up';
    return `<span class="inline-flex items-center gap-1.5 h-7 pl-2.5 pr-3.5 rounded-full ${c}" data-k="timer">${icon('clock', 'w-3.5 h-3.5 text-mute')}<span class="text-[11px] text-mute font-medium">${label}</span><b class="text-[15px] font-medium tabular-nums" data-tick="${ms}">${h}:${m}:${s}</b></span>`;
  }
  function cta(btns) {
    return `<div class="mx-[17px] mt-7 pt-[18px] border-t border-line flex gap-2" data-k="cta">${btns.map(([label, act, cls, extra]) => `<button type="button" class="btn ${cls} flex-1" data-act="${act}" ${extra || ''}>${label}</button>`).join('')}</div>`;
  }
  const mainBtn = () => [L('메인으로', 'Go to main'), 'main', 'btn-line'];
  const NOTES = () => [
    'Apple is not a sponsor or involved in the activity in any manner.',
    L('본 이벤트는 당사의 재량에 따라 사전 안내 없이 종료될 수 있습니다.', 'This event may end at our discretion without prior notice.'),
    L('본 이벤트의 세부 사항은 당사 또는 파트너의 사정에 따라 사전 안내 없이 변경될 수 있습니다.', "Details of this event may change without prior notice due to our or our partners' circumstances."),
    L('본 이벤트는 TetherMax 회원만 TetherMax 앱에서 참여할 수 있습니다.', 'This event is open only to TetherMax members in the TetherMax app.'),
    L('투표는 회차당 1회만 할 수 있으며, 확정한 뒤에는 바꿀 수 없습니다.', "You can make one call per round, and it can't be changed after you lock it in."),
    L('매일 09:00~10:00(UTC)에는 투표할 수 없습니다.', "Calls can't be made from 09:00 to 10:00 (UTC) every day."),
    L('판정가는 결과 발표 시각(10:00 UTC)의 BTC 가격이며, 판정가가 기준가 이상이면 상승으로 판정합니다.', "The final price is the BTC price at result time (10:00 UTC); if it's at or above the entry price, the result is Up."),
    L('이 페이지에 표시된 현재 BTC 가격은 실제 가격과 다를 수 있습니다.', 'The current BTC price shown on this page may differ from the actual price.'),
    L('보상은 이벤트 리워드로 적립금에 쌓이며, 1 USDT 단위로 연동한 거래소 계정에 지급됩니다.', 'Rewards are added to your balance as Event Rewards and paid to your linked exchange account in 1 USDT units.'),
    L('이벤트 리워드는 받은 거래 수수료 페이백이 같은 금액 이상일 때 출금할 수 있습니다.', "Event Rewards can be withdrawn once the trading fee cashback you've received is at least the same amount."),
    L('리워드 수령 시 잘못 선택한 계정에 대한 책임은 참여자에게 있습니다.', 'Participants are responsible if they choose the wrong account when receiving rewards.'),
    L('비정상적인 방법으로 이벤트에 참여한 사용자는 사전 안내 없이 TetherMax 서비스 이용이 제한될 수 있습니다.', 'Users who join the event by abnormal means may be restricted from using TetherMax without prior notice.'),
  ];
  function notesAcc(extra = '') {
    return `<div class="mx-[17px] mt-6 mb-8 bg-white rounded-2xl shadow-[0_12px_28px_rgba(31,66,191,.06),0_1px_2px_rgba(20,23,28,.04)] ${extra}" data-k="notes">
      <button type="button" data-act="notes" aria-expanded="${S.notes}" class="w-full h-[54px] px-[18px] flex items-center justify-between text-[15px] font-bold">${L('유의사항', 'Notes')}${icon(S.notes ? 'chevron-up' : 'chevron-down', 'w-5 h-5 text-mute')}</button>
      ${S.notes ? `<ul class="px-[18px] pb-4 -mt-1 space-y-1.5 list-disc pl-8 text-[12px] leading-[1.6] text-mute">${NOTES().map((n) => `<li>${n}</li>`).join('')}</ul>` : ''}
    </div>`;
  }

  // ---------- 화면 ----------
  function resolve(p) {
    const ph = phase();
    if (p === 'P01' && S.vote && ph === 'open') return 'P02';
    if ((p === 'P01' || p === 'P02') && ph === 'closed') return 'P03';
    if (p === 'P01' && ph === 'tally') return 'P02';
    return p;
  }
  const SCREENS = {
    P01() {
      const r = roundOf(nowMs()); const left = r.closeAt - nowMs();
      const dis = has('e01') ? 'disabled' : '';
      const tile = (dir) => {
        const up = dir === 'up';
        return `<div class="rounded-[24px] ${up ? 'bg-up-soft' : 'bg-down-soft'} pt-3.5 pb-4 flex flex-col items-center ${has('e01') ? 'opacity-50' : ''}" data-k="${dir}">
          ${arrow(dir, 65)}
          <p class="mt-1.5 text-[16px] font-bold tracking-[-0.3px] ${up ? 'text-up' : 'text-down'}">${up ? L('올라간다', 'Going up') : L('떨어진다', 'Going down')}</p>
          <button type="button" data-act="pick" data-dir="${dir}" ${dis} class="mt-2.5 h-[38px] w-[74px] rounded-full text-white text-[13px] font-bold ${up ? 'bg-up' : 'bg-down'} disabled:cursor-not-allowed">${L('선택', 'Select')}</button>
        </div>`;
      };
      const live = S.few ? `<span>${L('투표에 참여하고 혜택도 받아가세요', 'Make a call and get rewards')}</span>` : (EN ? `<span><b class="text-ink">1,240</b> joined today</span>` : `<span>오늘 <b class="text-ink">1,240</b>명 참여 중</span>`);
      return `${header()}
      <section class="px-[17px] pt-3 flex gap-3" data-k="title">
        ${coin(72)}
        <div><h1 class="text-[19px] font-bold leading-[26px] tracking-[-0.6px]">${L('비트코인이 오를지<br>내릴지 맞혀보세요', 'Call bitcoin:<br>up or down?')}</h1>
          <div class="mt-2">${chip(L('마감까지', 'Closes in'), left, left < HOUR ? 'amber' : 'green')}</div>
          <p class="mt-1 text-[11px] text-mute">${L('결과는 마감 1시간 뒤에 발표돼요', 'Results are announced 1 hour after close')}</p></div>
      </section>
      <div class="mt-6">${btcCard()}</div>
      <div class="mx-[17px] mt-4 grid grid-cols-2 gap-[10px]">${tile('up')}${tile('down')}</div>

  const preview = (small) => `<div class="relative ${small ? 'h-[86px]' : 'h-[100px]'} w-full" data-k="preview"><span class="absolute left-[8%] right-[8%] top-4 bottom-0 rounded-[18px] bg-[#E5E7EB]"></span><span class="absolute left-[4%] right-[4%] top-2 bottom-2 rounded-[18px] bg-[#D1D5DB]"></span>

    popup(`<h2 class="text-[18px] font-bold text-center">${L('마케팅 수신 동의 상세', 'Marketing consent details')}</h2>
      <ul class="mt-4 rounded-2xl bg-sunk px-4 py-3.5 space-y-1.5 text-[12.5px] text-body leading-[1.6]" data-k="mktInfo"><li>${L('• 전송자 : 테더맥스', '• Sender: TetherMax')}</li><li>${L(`• 수신일시 : ${p} UTC`, `• Received at: ${p} UTC`)}</li><li>${L('• 처리 내용 : 마케팅 정보 수신 동의 알림 동의', '• Action: consent to marketing information notifications')}</li></ul>

    closeOv();
    layer.innerHTML = `<div class="fixed inset-0 z-[60] bg-[#F2F2F7] p-5"><span class="absolute top-3 left-1/2 -translate-x-1/2 text-[11px] font-semibold text-white bg-[#7C3AED] px-2 py-1 rounded-full">${L('시뮬레이션 · 기기 설정 앱', 'Simulation · device Settings')}</span>

  // ---------- 조작 ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act;
    if (a === 'back') { if (S.stack.length) go(S.stack.pop(), false); else outside(L('혜택 홈으로 이동', 'Goes to Benefits home')); return; }

    if (a === 'dim') { if (layer.querySelector('[data-k="result"], [data-k="e09"]')) return; closeOv(); return; }

    if (a === 'resOk') { closeOv(); render(); if (has('e12')) sanctionVote(); else nextInQueue(); return; }
    if (a === 'row') { const r = HIST[+t.dataset.i]; const viewed = r.st !== 'view'; if (!viewed) r.st = r.final >= r.entry === (r.dir === 'up') ? 'hit' : 'miss';

    if (a === 'claim') { if (has('e13')) { sanctionClaim(); return; } if (S.acc === 'none') linkPrompt(true); else if (S.acc === 'nobonus') linkPrompt(false); else openAcc(); return; }
    if (a === 'selAcc') { sel = t.dataset.key; openAcc(); return; }
    if (a === 'pay') { pay(); return; }
    if (a === 'reAcc') { const first = ['0-0', '1-0', '2-0', '2-1'].find((k) => !dead.has(k)); sel = first; openAcc(); return; }

    if (a === 'link') { closeOv(); outside(L('계정 연동 화면으로 이동', 'Goes to account linking')); return; }
    if (a === 'store') { outside(L('OS별 스토어로 이동 (iOS App Store / Google Play)', 'Goes to the OS store (App Store / Google Play)')); return; }
    if (a === 'chat') { outside(L('실시간 상담 열기', 'Opens live chat')); return; }
    if (a === 'notiOn') { notiOn(); return; }
    if (a === 'cAll') { const v = !['svc', 'mkt', 'ad'].every((k) => consent[k]); ['svc', 'mkt', 'ad'].forEach((k) => (consent[k] = v)); consentSheet(); return; }
    if (a === 'cOne') { consent[t.dataset.c] = !consent[t.dataset.c]; consentSheet(); return; }
    if (a === 'cDetail') { showToast(L('동의 상세 팝업 (문구 확인 필요)', 'Consent details popup (copy TBD)')); return; }
    if (a === 'agree') { if (window.devLog) window.devLog('api', '수신 동의 저장: 필수 알림 · 마케팅 정보 수신 동의 · 마케팅 알림 = Y'); closeOv(); marketingDetail(); return; }
    if (a === 'mktOk') { closeOv(); deviceCheck('마케팅 동의 상세 팝업 [확인]'); return; }
    if (a === 'ndOn') { closeOv(); if (S.os === 'yes') osDialog(); else settingsApp(); return; }
    if (a === 'osYes') { S.nd = 'on'; if (window.devPost) window.devPost({ type: 'tm:env', device: 'on' }); done(L('OS 창 [허용]', 'OS prompt [Allow]')); return; }
    if (a === 'osNo') { closeOv(); S.noti = 's2'; render(); showToast(L('기기 알림이 꺼져 있어 결과 알림을 받을 수 없어요', "Device notifications are off, so you can't get result notifications")); if (window.devLog) window.devLog('result', L('알림 신청 안 됨 — OS 창 [허용 안 함]', "Not signed up — OS prompt [Don't Allow]")); return; }
    if (a === 'backApp') { window.resumeApp(L('설정 앱에서 돌아옴', 'returned from Settings')); return; }
  });
  document.addEventListener('change', (e) => { if (e.target.matches('[data-act="setNd"]')) { S.nd = e.target.checked ? 'on' : 'off'; if (window.devPost) window.devPost({ type: 'tm:env', device: S.nd }); } });
  window.addEventListener('resize', () => { if (S.cur === 'W01') render(); });

  // ---------- 처음 열기 ----------
  render();
  const OV = {
    s01up: () => openPick('up'), s01down: () => openPick('down'), acc: openAcc, d01a: () => linkPrompt(true), d01b: () => linkPrompt(false),
    consent: consentSheet, device: deviceGuide, os: osDialog, settings: settingsApp,
    attend1: () => attendPopup(1, false), attend3: () => attendPopup(3, false), attend6: () => attendPopup(6, false), attend8: () => attendPopup(8, false), attendBroken: () => attendPopup(1, true), attend7: () => attendPopup(7, false),
    paid: () => { pay(); }, e02: () => { openPick('up'); flags.add('e02'); }, e10: () => openPick('up'), e13: sanctionClaim, mkt: marketingDetail,
  };
  if (has('e09')) queue.push(updatePopup);
  if (S.res === 'hit') queue.push(() => resultPopup(RES.hit, true));
  if (S.res === 'miss') queue.push(() => resultPopup(RES.miss, true));
  if (S.res === 'multi') queue.push(multiPopup);
  if (H.ov && OV[H.ov]) queue.push(OV[H.ov]);
  nextInQueue();
  window.DV = { S, render, openPick, openAcc, notiOn, has };
})();

  // ===================================================================
  // [DEV] 개발 확인용 브리지. 셸(index.html)이 케이스를 고르면
  //   1) #해시로 화면 · 상태를 정하고
  //   2) 불러온 뒤 postMessage({type:'tm:steps', steps}) 로 클릭 같은 조작을 이어서 한다
  // 이 페이지 안에서 일어난 일(토스트 · 이동 · API 호출 지점)은 tm:log 로 셸에 알린다
  // ===================================================================
  (() => {
    const inShell = window.self !== window.top;
    const post = (msg) => { if (inShell) { try { parent.postMessage(msg, '*'); } catch (e) { /* 무시 */ } } };
    window.devPost = post;
    window.devLog = (kind, msg) => post({ type: 'tm:log', kind, msg });
    // 현행 페이지 링크는 이동 대신 토스트
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      e.preventDefault(); showToast(document.documentElement.lang === 'en' ? 'Opens an existing page (outside this prototype)' : '현행 페이지로 이동 (프로토타입 범위 밖)');
    }, true);
    const visible = (sel) => [...document.querySelectorAll(sel)].find((el) => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function run(steps) {
      for (const sp of steps || []) {
        if (sp.wait) await wait(sp.wait);
        if (sp.click) { const el = visible(sp.click); if (el) el.click(); else window.devLog('warn', `조작 대상을 못 찾음: ${sp.click}`); await wait(sp.after || 150); }
        if (sp.scroll !== undefined) { window.scrollTo(0, sp.scroll); await wait(200); }
        if (sp.hl) { await wait(60); const el = visible(sp.hl); if (el) el.scrollIntoView({ block: 'center' }); }
        if (sp.notify) { const el = visible('[data-act="notiOn"]'); if (el) el.click(); else window.devLog('warn', '알림 배너 [알림 켜기]가 지금 화면에 없어요'); }
      }
      post({ type: 'tm:stepsDone' });
    }
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'tm:steps') run(d.steps);
      if (d.type === 'tm:resume') window.resumeApp(document.documentElement.lang === 'en' ? 'back from background · app relaunch' : '백그라운드에서 복귀 · 앱 재실행');
      if (d.type === 'tm:env') window.setEnv(d);
    });

    // ---------- 확인 포인트 표시 (번호 + 점선 테두리) ----------
    const layer = document.createElement('div');
    layer.setAttribute('aria-hidden', 'true');
    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2147483000';
    document.body.appendChild(layer);
    let marks = [], showMarks = true, focusN = 0, lastVis = null;
    const mst = document.createElement('style');
    mst.textContent = `
      .dev-mk{position:fixed;border:1.5px dashed #E5317A;border-radius:8px;box-sizing:border-box;transition:background-color .2s}
      .dev-mk.on{background:rgba(229,49,122,.08);border-style:solid;border-width:2px}
      .dev-mk b{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:#E5317A;color:#fff;font:700 12px/22px system-ui,sans-serif;text-align:center;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}
      .dev-mk.on b{transform:scale(1.15)}`;
    document.head.appendChild(mst);
    const resolve = (spec) => { const [sel, up] = spec.split(' ^'); let el = visible(sel.trim()); for (let i = 0; el && i < (+up || 0); i += 1) el = el.parentElement; return el; };
    // 팝업 · 시트가 열려 있으면 그 밖(뒤 화면)을 가리키는 번호는 숨기고, 셸에 알려 패널을 잠시 접는다
    const openLayer = () => [...document.querySelectorAll('[aria-modal="true"]')].reverse().find((el) => el.getClientRects().length) || null;
    let layerWas = null;
    function drawMarks() {
      layer.style.display = showMarks ? '' : 'none';
      const top = openLayer();
      if (!!top !== layerWas) { layerWas = !!top; post({ type: 'tm:layer', open: layerWas }); }
      while (layer.children.length < marks.length) {
        const d = document.createElement('div'); d.className = 'dev-mk'; d.innerHTML = '<b></b>';
        d.firstChild.addEventListener('click', () => post({ type: 'tm:markClick', n: +d.dataset.n }));
        layer.appendChild(d);
      }
      const placed = [];
      [...layer.children].forEach((d, i) => {
        const m = marks[i]; const el = m && resolve(m.sel);
        const r = el && (!top || top.contains(el)) && el.getBoundingClientRect();
        if (!r || (!r.width && !r.height)) { d.style.display = 'none'; return; }
        d.style.display = ''; d.dataset.n = m.n; d.firstChild.textContent = m.n;
        d.classList.toggle('on', focusN === m.n);
        const same = placed.find((p) => Math.abs(p.r.left - r.left) < 2 && Math.abs(p.r.top - r.top) < 2 && Math.abs(p.r.width - r.width) < 2 && Math.abs(p.r.height - r.height) < 2);
        const inset = same ? 4 : 0;
        // 화면(휴대폰 틀) 밖으로 나가지 않게 테두리 · 번호 위치를 안쪽으로 맞춘다
        const W = document.documentElement.clientWidth, Hh = window.innerHeight, E = 4;
        const x1 = Math.max(E, r.left - 3 + inset), y1 = Math.max(E, r.top - 3 + inset);
        const x2 = Math.min(W - E, r.right + 3 - inset), y2 = Math.min(Hh - E, r.bottom + 3 - inset);
        d.style.left = x1 + 'px'; d.style.top = y1 + 'px';
        d.style.width = Math.max(0, x2 - x1) + 'px'; d.style.height = Math.max(0, y2 - y1) + 'px';
        let bx = Math.max(E + 8, x1 - 11); const by = Math.max(E + 8, y1 - 11);
        while (placed.some((p) => Math.abs(p.bx - bx) < 24 && Math.abs(p.by - by) < 24)) bx += 26;
        bx = Math.min(bx, W - E - 22);
        d.firstChild.style.left = (bx - x1) + 'px'; d.firstChild.style.top = (by - y1) + 'px';
        placed.push({ r, bx, by });
      });
      const vis = [...layer.children].filter((d) => d.style.display !== 'none' && d.dataset.n).map((d) => +d.dataset.n).filter((n) => marks.some((m) => m.n === n));
      const sig = vis.join(',');
      if (sig !== lastVis) { lastVis = sig; post({ type: 'tm:markVis', vis }); }
    }
    setInterval(drawMarks, 250);
    let raf = 0;
    window.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawMarks); }, { capture: true, passive: true });
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'tm:marks') { marks = d.list || []; showMarks = d.show !== false; drawMarks(); }
      if (d.type === 'tm:markShow') { showMarks = !!d.show; drawMarks(); }
      if (d.type === 'tm:markGo') {
        const m = marks.find((x) => x.n === d.n); const el = m && resolve(m.sel);
        focusN = d.n;
        if (el) el.scrollIntoView({ block: 'center', inline: 'nearest' }); else window.devLog('warn', `${d.n}번 위치가 지금 화면에 없어요`);
        drawMarks(); setTimeout(() => { if (focusN === d.n) { focusN = 0; drawMarks(); } }, 2400);
      }
    });
    const ready = () => post({ type: 'tm:ready' });
    if (document.readyState === 'complete') setTimeout(ready, 60); else window.addEventListener('load', () => setTimeout(ready, 60), { once: true });
  })();
</script>
</body>
</html>
