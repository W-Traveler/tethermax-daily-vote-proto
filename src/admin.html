<!-- 백오피스 · 비트코인 방향 맞추기. 기준: PRD '백오피스 요구사항' · '백오피스 백엔드 요구사항'. Figma 화면 없음.
     회차 결과 / 참여 내역 / 적립 · 수령 내역 / 보상 설정 / 제재 관리 탭. 예시 데이터는 2026-10-28 기준 고정 -->
<title>비트코인 방향 맞추기 백오피스</title>
<style>body{margin:0;padding:0}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 기존 TetherMax 어드민과 같은 다크 2단 구성 (사이드바 + 본문), 상단에 프로토타입 컨트롤 바 */
:root{
  --bg:#0B0E14; --panel:#121620; --panel2:#171C28; --line:#242B3A; --row:#1B2130;
  --txt:#E6EAF2; --txt2:#9AA6BF; --txt3:#6B7896;
  --brand:#1943C8; --brand2:#3B6FE0; --brand-soft:#16203C; --brand-txt:#9CC0FF;
  --up:#5BD394; --up-bg:#10321F; --down:#FF8FA0; --down-bg:#3A1620;
  --warn:#FFCE85; --warn-bg:#2A2110; --muted-bg:#1C2331;
  --input:#0C1017; --side:#0E121B; --dim:rgba(3,7,18,.62);
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--txt); font-family:var(--font); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
button{cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand2); outline-offset:2px;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--side);}

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap;
  padding-block:12px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px));
  background:var(--side); border-bottom:1px solid var(--line);}
.brand{font-weight:800; font-size:15px; letter-spacing:-.3px;}
.brand span{color:var(--txt3); font-weight:500; font-size:12px; margin-left:8px;}
.controls{display:flex; gap:10px 16px; flex-wrap:wrap; align-items:center; margin-left:auto;}
.cap{font-size:11.5px; color:var(--txt3); font-weight:600; margin-right:6px;}
.grp-ctrl{display:flex; align-items:center;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex-wrap:wrap;}
.seg button{padding:4px 10px; background:transparent; border:none; color:var(--txt3); font-size:11.5px; font-weight:600;}
.seg button.on{background:var(--brand); color:#fff;}
.seg button:hover:not(.on){color:var(--txt);}

/* shell */
.admin{display:flex; min-height:calc(100vh - 53px);}
.side{width:232px; flex:0 0 232px; background:var(--side); border-right:1px solid var(--line); padding:16px 0 24px; font-size:13px;}
.side .logo{padding:0 16px 14px; font-weight:800; font-size:15px;}
.side .search{margin:0 16px 12px; background:var(--input); border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--txt3); font-size:12.5px;}
.side .g{padding:9px 16px; color:var(--txt2); display:flex; justify-content:space-between; font-weight:600;}
.side .g span{color:var(--txt3); font-size:11px;}
.side .s{display:block; width:100%; text-align:left; padding:7px 16px 7px 28px; color:var(--txt3); background:transparent; border:none; border-left:2px solid transparent; font-size:12.5px;}
.side .s.mine{color:var(--txt2);}
.side .s.on{background:var(--brand-soft); color:var(--brand-txt); border-left-color:var(--brand2); font-weight:700;}
.side .s:hover:not(.on){color:var(--txt);}
.new{background:var(--brand); color:#fff; font-size:9.5px; padding:1px 5px; border-radius:20px; margin-left:6px; font-weight:700;}
.main{flex:1; min-width:0; padding-block:24px 48px; padding-left:28px; padding-right:max(28px, env(safe-area-inset-right,0px));}

.pagehead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.pagehead h1{font-size:22px; font-weight:800; margin:0; letter-spacing:-.3px; text-wrap:balance;}
.pagehead .right{margin-left:auto; display:flex; gap:8px;}
.tabbar{display:flex; gap:2px; border-bottom:1px solid var(--line); margin:14px 0 14px; overflow-x:auto;}
.tab{background:transparent; border:none; border-bottom:2px solid transparent; color:var(--txt3); font-size:13.5px; font-weight:700; padding:10px 14px; white-space:nowrap; margin-bottom:-1px;}
.tab.on{color:var(--txt); border-bottom-color:var(--brand2);}
.tab:hover:not(.on){color:var(--txt2);}
.tabhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
.tabhead .right{margin-left:auto; display:flex; gap:8px;}

/* filters */
.filters{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
.frow{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;}
.fld{display:flex; flex-direction:column; gap:3px; min-width:0;}
.fld label{font-size:11px; color:var(--txt3); font-weight:600;}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--input); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:7px 10px; font-size:12.5px; min-width:0;}
select{min-width:150px;}
input[type=date]{min-width:150px;}
.grow{flex:1 1 240px;}
.grow input{width:100%;}
.dash{color:var(--txt3); padding-bottom:7px;}
.fbtns{margin-left:auto; display:flex; gap:8px;}

.btn{padding:7px 16px; border-radius:6px; border:1px solid transparent; background:var(--brand2); color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap;}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--txt2);}
.btn.white{background:#F1F4FA; color:#0B0E14;}
.btn.danger{background:transparent; border-color:#5A2230; color:var(--down);}
.btn.sm{padding:4px 10px; font-size:11.5px;}
.btn.lg{padding:10px 20px; font-size:13.5px; border-radius:8px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn:hover:not(:disabled){filter:brightness(1.12);}

/* table */
.tablewrap{overflow-x:auto; border-radius:8px; background:var(--panel); border:1px solid var(--line);}
table{width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums;}
th{text-align:left; padding:11px 12px; color:var(--txt2); font-weight:700; font-size:12px; border-bottom:1px solid var(--line); background:var(--side); white-space:nowrap;}
td{padding:11px 12px; border-bottom:1px solid var(--row); vertical-align:middle; white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#141A26;}
td.num,th.num{text-align:right;}
.mono{font-family:var(--mono); font-size:12px;}
.empty{padding:48px 12px; text-align:center; color:var(--txt3);}
.link{background:none; border:none; padding:0; color:var(--brand-txt); font-size:inherit; text-decoration:underline; text-underline-offset:2px;}
.foot{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--txt2);}
.pager{display:flex; gap:5px; flex-wrap:wrap;}
.pager button{width:26px; height:26px; border-radius:50%; border:1px solid var(--txt3); background:transparent; color:var(--txt); font-size:11px;}
.pager button.on{background:var(--brand2); border-color:var(--brand2); color:#fff;}
.pager button:disabled{opacity:.3; cursor:not-allowed;}

.pill{display:inline-block; padding:1px 10px; border-radius:20px; font-size:11px; font-weight:700; border:1px solid transparent;}
.p-up{color:var(--up); background:var(--up-bg);}
.p-down{color:var(--down); background:var(--down-bg);}
.p-wait{color:var(--txt2); background:var(--muted-bg);}
.p-live{color:var(--brand-txt); background:var(--brand-soft);}
.p-fail{color:var(--warn); background:var(--warn-bg); border-color:#574115;}
.p-y{color:var(--up); border-color:#1F5738;}
.p-n{color:var(--down); border-color:#5A2230;}
.p-cex{color:#94A3B8; background:rgba(148,163,184,.14);}
.p-dex{color:#C4B5FD; background:rgba(139,92,246,.18);}
tr.fail td{background:rgba(224,160,32,.06);}
.plus{color:var(--up);}
.minus{color:var(--txt);}

/* cards / forms */
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px;}
.card h3{margin:0 0 4px; font-size:14px; font-weight:700;}
.hint{color:var(--txt3); font-size:12px; margin:0 0 16px;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field > label{font-size:12.5px; font-weight:600; color:var(--txt2); display:flex; justify-content:space-between;}
.unit{display:flex; align-items:center; gap:8px;}
.unit input{width:160px;}
.unit .check input{width:auto;}
.unit span{color:var(--txt3); font-size:12px;}
.frow{display:flex; flex-wrap:wrap; align-items:flex-start; gap:16px 32px; margin-bottom:16px;}
.frow .field{margin:0; justify-content:flex-start;}
.err{font-size:11.5px; color:var(--down); font-weight:600;}
.note{background:var(--input); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; color:var(--txt2); margin-bottom:16px;}
.note b{color:var(--brand-txt);}
.ro{font-size:11.5px; color:var(--warn); margin-bottom:12px;}
.check{display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--txt2);}
textarea{width:100%; resize:vertical; line-height:1.6;}

/* modal / toast */
.modal{position:fixed; inset:0; background:var(--dim); z-index:70; display:flex; align-items:center; justify-content:center; padding:24px;}
.mcard{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:min(420px,100%); max-height:90vh; overflow:auto; box-shadow:0 24px 70px rgba(0,0,0,.5);}
.mcard.wide{width:min(520px,100%);}
.mcard h3{margin:0 0 14px; font-size:15px;}
.mmsg{font-size:13.5px; line-height:1.7; margin-bottom:18px; white-space:pre-line;}
.mbtns{display:flex; gap:8px; justify-content:flex-end; margin-top:4px;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(28px + env(safe-area-inset-bottom,0px)); z-index:80; background:var(--panel2); border:1px solid var(--line); padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s;}
.toast.on{opacity:1;}
@media (prefers-reduced-motion:reduce){.toast{transition:none;}}

@media (max-width:900px){
  .admin{flex-direction:column;}
  .side{width:auto; flex:none; border-right:none; border-bottom:1px solid var(--line); padding:10px 0; display:flex; overflow-x:auto; gap:4px; align-items:center;}
  .side .logo,.side .search,.side .g,.side .s:not(.mine){display:none;}
  .side .s.mine{width:auto; white-space:nowrap; padding:7px 12px; border-left:none; border-bottom:2px solid transparent;}
  .side .s.on{border-bottom-color:var(--brand2);}
  .main{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
  .topbar{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
  .controls{margin-left:0;}
  .fbtns{margin-left:0;}
}
</style>

  <div class="brand" id="brand"></div>
  <div class="controls" id="controls"></div>
</div>
<div class="admin">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

var seed=20261028;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
var NOW=new Date(Date.UTC(2026,9,28,7,51,0));
var MEMBERS=[],HEAVY=[];
for(var i=0;i<26;i++){MEMBERS.push(String(10000000+Math.floor(rnd()*69000)));}
HEAVY=MEMBERS.slice(0,5);
function pickMember(){return rnd()<0.5?HEAVY[Math.floor(rnd()*HEAVY.length)]:MEMBERS[Math.floor(rnd()*MEMBERS.length)];}
var ROUNDS=[],price=112400;
for(var r=0;r<30;r++){
  var day=new Date(Date.UTC(2026,8,29+r,10,0,0));
  var open=price; price=Math.round((price+(rnd()-0.47)*2300)*100)/100;
  var part=1000+Math.floor(rnd()*1700), upPct=0.45+rnd()*0.23, up=Math.round(part*upPct);
  var ds=dstr(day), status='done';
  if(r===29) status='live'; else if(ds==='2026-10-15') status='fail';
  if(status==='live'){part=Math.round(part*0.62);up=Math.round(part*upPct);}
  var res=price>=open?'up':'down', down=part-up, hits=res==='up'?up:down, misses=part-hits;
  var viewedRate=r===28?0.71:0.86+rnd()*0.12, viewed=Math.round(part*viewedRate);
  ROUNDS.push({date:ds,day:day,status:status,part:part,up:up,down:down,open:open,judge:status==='done'?price:null,result:status==='done'?res:null,
    hits:status==='done'?hits:null,misses:status==='done'?misses:null,viewed:status==='done'?viewed:null,
    sum:status==='done'?Math.round((viewed*(hits/part)*0.10+viewed*(misses/part)*0.05)*100)/100:0,hitAmt:0.10,missAmt:0.05});
}
ROUNDS.reverse();
var VOTES=[];
ROUNDS.slice().reverse().forEach(function(rd){
  var k=6+Math.floor(rnd()*5), used={};
  for(var j=0;j<k;j++){
    var m=pickMember(); if(used[m]) continue; used[m]=1;
    var dir=rnd()<rd.up/rd.part?'up':'down';
    var openAt=new Date(rd.day.getTime()-24*3600e3), conf=new Date(openAt.getTime()+Math.floor(rnd()*23*3600e3));
    if(rd.status==='live'&&conf>NOW) conf=new Date(NOW.getTime()-Math.floor(rnd()*20*3600e3));
    var result,seen=null,earn=null,seenAt=null;
    if(rd.status==='live') result='wait';
    else if(rd.status==='fail') result='fail';
    else {result=dir===rd.result?'hit':'miss'; seen=rnd()<(rd.date==='2026-10-27'?0.6:0.9);
      if(seen){earn=result==='hit'?rd.hitAmt:rd.missAmt; seenAt=new Date(rd.day.getTime()+Math.floor(rnd()*30*3600e3)); if(seenAt>NOW) seenAt=new Date(NOW.getTime()-Math.floor(rnd()*3600e3));}}
    VOTES.push({member:m,round:rd.date,dir:dir,ref:Math.round((rd.open+(rnd()-0.5)*900)*100)/100,conf:conf,result:result,seen:seen,seenAt:seenAt,earn:earn});
  }
});
VOTES.sort(function(a,b){return b.conf-a.conf;});
var EXCH=[{n:'Bitget',t:'CEX'},{n:'OKX',t:'CEX'},{n:'Bybit',t:'CEX'},{n:'LBank',t:'CEX'},{n:'Gate',t:'CEX'},{n:'ApeX',t:'DEX'}];
var ACCT={};
MEMBERS.forEach(function(m){var e=EXCH[Math.floor(rnd()*EXCH.length)],a;
  if(e.t==='CEX'){a=String(Math.floor(1e7+rnd()*9e9));}else{a='0x';for(var q=0;q<40;q++)a+='0123456789abcdef'[Math.floor(rnd()*16)];}
  ACCT[m]={exch:e.n,type:e.t,acct:a};});
var LEDGER=[];
(function(){
  var ev=[];
  VOTES.forEach(function(v){if(v.seen) ev.push({member:v.member,type:v.result==='hit'?'hit':'miss',amount:v.earn,at:v.seenAt});});
  HEAVY.forEach(function(m){var vs=VOTES.filter(function(v){return v.member===m;}).sort(function(a,b){return a.conf-b.conf;});
    for(var n=6;n<vs.length;n+=7) ev.push({member:m,type:'bonus',amount:0.10,at:new Date(vs[n].conf.getTime()+1000)});});
  ev.sort(function(a,b){return a.at-b.at;});
  var bal={},failed=0;
  ev.forEach(function(e){
    bal[e.member]=Math.round(((bal[e.member]||0)+e.amount)*100)/100;
    LEDGER.push({member:e.member,type:e.type,amount:e.amount,bal:bal[e.member],at:e.at,ok:true});
    if(bal[e.member]>=1&&rnd()<0.45){
      var amt=Math.floor(bal[e.member]),at=new Date(e.at.getTime()+Math.floor(rnd()*5*3600e3)),ac=ACCT[e.member];
      if(at>NOW) return;
      if(failed<2&&rnd()<0.25){failed++;LEDGER.push({member:e.member,type:'payout',amount:-amt,bal:bal[e.member],at:at,ok:false,exch:ac.exch,atype:ac.type,acct:ac.acct});}
      bal[e.member]=Math.round((bal[e.member]-amt)*100)/100;
      LEDGER.push({member:e.member,type:'payout',amount:-amt,bal:bal[e.member],at:new Date(at.getTime()+60000),ok:true,exch:ac.exch,atype:ac.type,acct:ac.acct});
    }
  });
  LEDGER.sort(function(a,b){return b.at-a.at;});
})();

    '<div class="filters"><div class="frow">'+sel('f-state',T('fStatus'),[['',T('all')],['active',T('stActive')],['released',T('stReleased')]],f.state)+kw(f)+btns()+'</div></div>';
  h+=table([['thNo'],['thMember'],['thReason'],['thFromAt'],['thToAt'],['thRegBy'],['thState'],['thRelAt'],['thRelBy'],['thRelReason'],['thManage']],rows,function(s,n){
    var act=s.state==='active';
    return '<tr><td>'+n+'</td><td>'+s.member+'</td><td style="white-space:normal;min-width:200px">'+esc(s.reason)+'</td>'+
      '<td>'+dtstr(s.from)+'</td><td>'+(s.to?dtstr(s.to):esc(T('forever')))+'</td><td>'+esc(s.by)+'</td>'+
      '<td><span class="pill '+(act?'p-n':'p-wait')+'">'+esc(T(act?'stActive':'stReleased'))+'</span></td>'+
      '<td>'+(s.relAt?dtstr(s.relAt):'-')+'</td><td>'+(s.relBy?esc(s.relBy==='@system'?T('sysUser'):s.relBy):'-')+'</td>'+
      '<td style="white-space:normal;min-width:140px">'+(s.relReason?esc(s.relReason==='@expired'?T('relExpired'):s.relReason):'-')+'</td>'+
      '<td>'+(act?'<button type="button" class="btn danger sm" data-act="openRel" data-idx="'+S.sanctions.indexOf(s)+'"'+(ro?' disabled':'')+'>'+esc(T('release'))+'</button>':'-')+'</td></tr>';
  });
  return h;
}
function renderMain(){
  var m=document.getElementById('main');
  m.innerHTML={rounds:vRounds,votes:vVotes,ledger:vLedger,sanctions:vSanctions}[S.view]();
}

/* ================= 모달 ================= */
function modal(inner,wide){
  closeModal();
  var ov=document.createElement('div');ov.className='modal';ov.id='modal';
  ov.innerHTML='<div class="mcard'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+inner+'</div>';
  document.body.appendChild(ov);
  var first=ov.querySelector('input,textarea,button');if(first) first.focus();
  return ov;
}
function closeModal(){var o=document.getElementById('modal');if(o) o.remove();}
function msg(text,buttons){
  var ov=modal('<div class="mmsg">'+esc(text)+'</div><div class="mbtns">'+buttons.map(function(b,i){return '<button type="button" class="btn '+(b.kind||'ghost')+' lg" data-i="'+i+'">'+esc(b.label)+'</button>';}).join('')+'</div>');
  ov.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b) return;var fn=buttons[+b.dataset.i].on;closeModal();if(fn) fn();});
}
function openReg(){
  var today='2026-10-28';
  var ov=modal('<h3>'+esc(T('mRegTitle'))+'</h3><p class="hint">'+esc(T('mRegHint'))+'</p>'+
    '<div class="field"><label for="m-member">'+esc(T('mMember'))+'</label><input type="text" id="m-member" inputmode="numeric" placeholder="'+esc(T('mMemberPh'))+'"><span class="err" id="e-member"></span></div>'+
    '<div class="field"><label for="m-until">'+esc(T('mPeriod'))+'</label><div class="unit"><input type="date" id="m-until" min="'+today+'"><label class="check"><input type="checkbox" id="m-forever"> '+esc(T('mForever'))+'</label></div><span class="err" id="e-until"></span></div>'+
    '<div class="field"><label for="m-reason">'+esc(T('mReason'))+' <span id="m-cnt" style="color:var(--txt3);font-weight:500">0 / 200</span></label><textarea id="m-reason" rows="3" maxlength="200" placeholder="'+esc(T('mReasonPh'))+'"></textarea><span class="err" id="e-reason"></span></div>'+
    '<div class="mbtns"><button type="button" class="btn ghost lg" data-x="cancel">'+esc(T('cancel'))+'</button><button type="button" class="btn lg" data-x="ok">'+esc(T('sRegister'))+'</button></div>',true);
  var fr=ov.querySelector('#m-forever'),un=ov.querySelector('#m-until'),rs=ov.querySelector('#m-reason');
  fr.onchange=function(){un.disabled=fr.checked;};
  rs.oninput=function(){ov.querySelector('#m-cnt').textContent=rs.value.length+' / 200';};
  ov.addEventListener('click',function(e){
    var x=e.target.closest('[data-x]');if(!x) return;
    if(x.dataset.x==='cancel'){closeModal();return;}
    var m=ov.querySelector('#m-member').value.trim(),ok=true;
    ['member','until','reason'].forEach(function(k){ov.querySelector('#e-'+k).textContent='';});
    if(MEMBERS.indexOf(m)<0){ov.querySelector('#e-member').textContent=T('eMember');ok=false;}
    else if(S.sanctions.some(function(s){return s.member===m&&s.state==='active';})){ov.querySelector('#e-member').textContent=T('eDup');ok=false;}
    if(!fr.checked&&!un.value){ov.querySelector('#e-until').textContent=T('eUntil');ok=false;}
    if(!rs.value.trim()){ov.querySelector('#e-reason').textContent=T('eReason');ok=false;}
    if(!ok) return;
    var rec={member:m,reason:rs.value.trim(),from:new Date(NOW.getTime()),to:fr.checked?null:new Date(un.value+'T23:59:59Z'),by:'admin01',state:'active'};
    msg(T('cfSanction'),[{label:T('cancel'),on:openRegKeep(rec)},{label:T('confirm'),kind:'primary',on:function(){S.sanctions.push(rec);S.page.sanctions=1;renderMain();toast(T('tRegistered'));}}]);
  });
}
function openRegKeep(){return null;}
function openRel(idx){
  var s=S.sanctions[idx];
  var ov=modal('<h3>'+esc(T('mRelTitle'))+'</h3><p class="hint">'+esc(T('memberNo'))+' '+s.member+'</p>'+
    '<div class="field"><label for="m-rel">'+esc(T('mRelReason'))+'</label><textarea id="m-rel" rows="3" maxlength="200" placeholder="'+esc(T('mRelPh'))+'"></textarea><span class="err" id="e-rel"></span></div>'+
    '<div class="mbtns"><button type="button" class="btn ghost lg" data-x="cancel">'+esc(T('cancel'))+'</button><button type="button" class="btn danger lg" data-x="ok">'+esc(T('release'))+'</button></div>');
  ov.addEventListener('click',function(e){
    var x=e.target.closest('[data-x]');if(!x) return;
    if(x.dataset.x==='cancel'){closeModal();return;}
    var v=ov.querySelector('#m-rel').value.trim();
    if(!v){ov.querySelector('#e-rel').textContent=T('eReason');return;}
    msg(T('cfRelease'),[{label:T('cancel')},{label:T('confirm'),kind:'primary',on:function(){s.state='released';s.relReason=v;s.relBy='admin01';s.relAt=new Date(NOW.getTime());renderMain();toast(T('tReleased'));}}]);
  });
}

/* ================= 이벤트 ================= */
function readFilters(){
  var f=S.f[S.view];
  function v(id){var el=document.getElementById(id);return el?el.value:undefined;}
  ['start','end'].forEach(function(k){var x=v('f-'+k);if(x!==undefined) f[k]=x;});
  [['status','f-status'],['kw','f-kw'],['round','f-round'],['dir','f-dir'],['result','f-result'],['type','f-type'],['proc','f-proc'],['state','f-state']].forEach(function(p){var x=v(p[1]);if(x!==undefined) f[p[0]]=x;});
  if(S.view==='ledger'){var k=v('f-kind');if(k) f.kind=k;}
}
function go(v){if(VIEWS.indexOf(v)<0) v='rounds';S.view=v;S.empty=false;
  try{if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);}catch(e){}
  render();window.scrollTo(0,0);}
document.getElementById('side').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b) go(b.dataset.view);});
document.getElementById('controls').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b) return;
  if(b.dataset.lang){S.lang=b.dataset.lang;render();return;}
  if(b.dataset.role){S.role=b.dataset.role;render();return;}
  var c=b.dataset.case;if(!c) return;
  if(c==='cSession') msg(T('msgSession'),[{label:T('relogin'),kind:'primary'}]);
  else if(c==='cNoAccess') msg(T('msgNoAccess'),[{label:T('confirm'),kind:'primary'}]);
  else if(c==='cNoSave') msg(T('msgNoSave'),[{label:T('confirm'),kind:'primary'}]);
  else if(c==='cEmpty'){S.empty=!S.empty;b.classList.toggle('on',S.empty);renderMain();}
});
document.getElementById('main').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled) return;
  if(b.dataset.view){go(b.dataset.view);return;}
  if(b.dataset.page){S.page[S.view]=+b.dataset.page;renderMain();return;}
  var a=b.dataset.act;
  if(a==='search'){readFilters();S.page[S.view]=1;S.empty=false;renderMain();}
  else if(a==='reset'){S.f[S.view]=defFilter(S.view);S.page[S.view]=1;S.empty=false;renderMain();}
  else if(a==='member'){S.f.votes.kw=b.dataset.m;S.page.votes=1;renderMain();}
  else if(a==='openReg') openReg();
  else if(a==='openRel') openRel(+b.dataset.idx);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape') closeModal();});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(v&&v!==S.view) go(v);});
(function(){try{if(new URLSearchParams(location.search).get('lang')==='en') S.lang='en';}catch(e){}
  var v=location.hash.slice(1);if(VIEWS.indexOf(v)>-1) S.view=v;render();})();
</script>

<!-- [DEV] 개발 확인용 브리지 (proto.html과 같은 방식): 셸의 조작(tm:steps) · 번호 표시(tm:marks)를 받는다 -->
<script>
  (() => {
    const inShell = window.self !== window.top;
    const post = (msg) => { if (inShell) { try { parent.postMessage(msg, '*'); } catch (e) { /* 무시 */ } } };
    window.devLog = (kind, msg) => post({ type: 'tm:log', kind, msg });
    const visible = (sel) => [...document.querySelectorAll(sel)].find((el) => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function run(steps) {
      for (const sp of steps || []) {
        if (sp.wait) await wait(sp.wait);
        if (sp.click) { const el = visible(sp.click); if (el) el.click(); else window.devLog('warn', `조작 대상을 못 찾음: ${sp.click}`); await wait(sp.after || 120); }
        if (sp.select) { const el = visible(sp.select[0]); if (el) { el.value = sp.select[1]; el.dispatchEvent(new Event('change', { bubbles: true })); } else window.devLog('warn', `조작 대상을 못 찾음: ${sp.select[0]}`); await wait(sp.after || 120); }
        if (sp.fill) { const el = visible(sp.fill[0]); if (el) { el.value = sp.fill[1]; el.dispatchEvent(new Event('input', { bubbles: true })); } else window.devLog('warn', `조작 대상을 못 찾음: ${sp.fill[0]}`); await wait(sp.after || 120); }
        if (sp.hl) { await wait(60); const el = visible(sp.hl); if (el) el.scrollIntoView({ block: 'center', inline: 'nearest' }); }
      }
      post({ type: 'tm:stepsDone' });
    }
    const layer = document.createElement('div');
    layer.setAttribute('aria-hidden', 'true');
    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2147483000';
    document.body.appendChild(layer);
    let marks = [], showMarks = true, focusN = 0, lastVis = null, layerWas = null;
    const mst = document.createElement('style');
    mst.textContent = `
      .dev-mk{position:fixed;border:1.5px dashed #E5317A;border-radius:8px;box-sizing:border-box;transition:background-color .2s}
      .dev-mk.on{background:rgba(229,49,122,.08);border-style:solid;border-width:2px}
      .dev-mk b{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:#E5317A;color:#fff;font:700 12px/22px system-ui,sans-serif;text-align:center;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}
      .dev-mk.on b{transform:scale(1.15)}`;
    document.head.appendChild(mst);
    const resolve = (spec) => { const [sel, up] = spec.split(' ^'); let el = visible(sel.trim()); for (let i = 0; el && i < (+up || 0); i += 1) el = el.parentElement; return el; };
    const openLayer = () => [...document.querySelectorAll('[aria-modal="true"]')].reverse().find((el) => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden') || null;
    function drawMarks() {
      layer.style.display = showMarks ? '' : 'none';
      const top = openLayer();
      if (!!top !== layerWas) { layerWas = !!top; post({ type: 'tm:layer', open: layerWas }); }
      while (layer.children.length < marks.length) {
        const d = document.createElement('div'); d.className = 'dev-mk'; d.innerHTML = '<b></b>';
        d.firstChild.addEventListener('click', () => post({ type: 'tm:markClick', n: +d.dataset.n }));
        layer.appendChild(d);
      }
      const placed = [];
      [...layer.children].forEach((d, i) => {
        const m = marks[i]; const el = m && resolve(m.sel);
        const r = el && (!top || top.contains(el)) && el.getBoundingClientRect();
        if (!r || (!r.width && !r.height)) { d.style.display = 'none'; return; }
        d.style.display = ''; d.dataset.n = m.n; d.firstChild.textContent = m.n;
        d.classList.toggle('on', focusN === m.n);
        d.style.left = (r.left - 3) + 'px'; d.style.top = (r.top - 3) + 'px';
        d.style.width = (r.width + 6) + 'px'; d.style.height = (r.height + 6) + 'px';
        let bx = r.left - 14; const by = r.top - 14;
        while (placed.some((p) => Math.abs(p.bx - bx) < 24 && Math.abs(p.by - by) < 24)) bx += 26;
        d.firstChild.style.left = (bx - (r.left - 3)) + 'px'; d.firstChild.style.top = '-11px';
        placed.push({ bx, by });
      });
      const vis = [...layer.children].filter((d) => d.style.display !== 'none' && d.dataset.n).map((d) => +d.dataset.n).filter((x) => marks.some((m) => m.n === x));
      const sig = vis.join(','); if (sig !== lastVis) { lastVis = sig; post({ type: 'tm:markVis', vis }); }
    }
    setInterval(drawMarks, 250);
    let raf = 0;
    window.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawMarks); }, { capture: true, passive: true });
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'tm:steps') run(d.steps);
      if (d.type === 'tm:marks') { marks = d.list || []; showMarks = d.show !== false; drawMarks(); }
      if (d.type === 'tm:markShow') { showMarks = !!d.show; drawMarks(); }
      if (d.type === 'tm:markGo') {
        const m = marks.find((x) => x.n === d.n); const el = m && resolve(m.sel);
        focusN = d.n;
        if (el) el.scrollIntoView({ block: 'center', inline: 'nearest' });
        drawMarks(); setTimeout(() => { if (focusN === d.n) { focusN = 0; drawMarks(); } }, 2400);
      }
    });
    const ready = () => post({ type: 'tm:ready', env: { device: 'off', osPrompt: 'yes' } });
    if (document.readyState === 'complete') setTimeout(ready, 60); else window.addEventListener('load', () => setTimeout(ready, 60), { once: true });
  })();
</script>
